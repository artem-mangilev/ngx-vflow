name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only; do not publish, commit or push'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  NX_DAEMON: 'false'

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - name: Configure release author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Version, changelog and publish all release packages
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        # A preview skips the publication: npm 11 refuses even a dry run of a version that is already published,
        # and a dry run leaves the current version in the manifests.
        run: pnpm nx release --dry-run="$DRY_RUN" $([ "$DRY_RUN" = "true" ] && echo --skip-publish || echo --yes)
      - name: Push release commit and tag
        if: ${{ !inputs.dry_run }}
        run: git push --follow-tags origin HEAD:main
