name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NX_DAEMON: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier . --check
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build:dev
      - run: npm run build
      - run: npm run release:dry-run
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Check the design system in production
        run: npm run e2e -- --grep "NgDoc uses"
        env:
          E2E_CONFIGURATION: production
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
