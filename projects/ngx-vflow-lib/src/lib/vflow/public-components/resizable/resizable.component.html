<ng-template #resizer>
  @for (position of linePositions; track position) {
    <div
      nodeResizeControl
      [position]="position"
      [variant]="lineVariant"
      [color]="resizerColor()"
      [minWidth]="effectiveMinWidth()"
      [minHeight]="effectiveMinHeight()"
      [maxWidth]="effectiveMaxWidth()"
      [maxHeight]="effectiveMaxHeight()"
      [keepAspectRatio]="keepAspectRatio()"
      [resizeDirection]="resizeDirection()"
      [autoScale]="autoScale()"
      [onResizeStart]="emitResizeStart"
      [onResize]="emitResize"
      [onResizeEnd]="emitResizeEnd"
      [shouldResize]="shouldResize()"></div>
  }

  @for (position of handlePositions; track position) {
    <div
      nodeResizeControl
      [position]="position"
      [variant]="handleVariant"
      [color]="resizerColor()"
      [minWidth]="effectiveMinWidth()"
      [minHeight]="effectiveMinHeight()"
      [maxWidth]="effectiveMaxWidth()"
      [maxHeight]="effectiveMaxHeight()"
      [keepAspectRatio]="keepAspectRatio()"
      [resizeDirection]="resizeDirection()"
      [autoScale]="autoScale()"
      [onResizeStart]="emitResizeStart"
      [onResize]="emitResize"
      [onResizeEnd]="emitResizeEnd"
      [shouldResize]="shouldResize()"></div>
  }
</ng-template>

<ng-content />
