version: 1
slices:
  - id: overview
    description: High-level overview of the library and a minimal flow
    include:
      - README.md

  - id: getting-started
    description: Quickstart, configuration with provideVflow, styling and CSS tokens
    include:
      - ../../apps/docs/src/app/categories/docs/getting-started/quickstart/**/*
      - ../../apps/docs/src/app/categories/docs/getting-started/configuration/**/*
      - ../../apps/docs/src/app/categories/docs/getting-started/styling/**/*

  - id: migration
    description: Migration from v2 to v3, every removed and renamed API
    include:
      - ../../apps/docs/src/app/categories/docs/getting-started/migration/**/*

  - id: nodes
    description: Node templates and components, dragging, resizing, subflows, node toolbar
    include:
      - ../../apps/docs/src/app/categories/docs/nodes/**/*

  - id: edges
    description: Edge templates and components, curves, markers, labels
    include:
      - ../../apps/docs/src/app/categories/docs/edges/**/*

  - id: handles-and-connections
    description: Handles, creating connections from the UI, validation, reconnection
    include:
      - ../../apps/docs/src/app/categories/docs/handles/**/*

  - id: interactions
    description: Selection, deleting, handling changes, keyboard shortcuts, accessibility
    include:
      - ../../apps/docs/src/app/categories/docs/interactions/**/*

  - id: viewport
    description: Viewport control and gestures, background, minimap, panels, portal, snapping
    include:
      - ../../apps/docs/src/app/categories/docs/viewport/**/*

  - id: graph
    description: Graph operations and geometry utilities
    include:
      - ../../apps/docs/src/app/categories/docs/graph/**/*

  - id: performance
    description: Virtualization and lazy loading of large flows
    include:
      - ../../apps/docs/src/app/categories/docs/performance/**/*
