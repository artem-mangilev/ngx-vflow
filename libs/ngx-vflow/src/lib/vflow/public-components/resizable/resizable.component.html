<ng-template #resizer>
  @if (enabled()) {
    <div
      vNoDrag
      class="v-resize-controls"
      [style.--resizer-gap.px]="gap()"
      [style.--resizer-scale]="scale()"
      (pointerdown)="press($event)">
      @for (control of controls; track control.position) {
        <div [class]="control.classes" [attr.data-v-resize-control]="control.position"></div>
      }
    </div>
  }
</ng-template>

<ng-content />
