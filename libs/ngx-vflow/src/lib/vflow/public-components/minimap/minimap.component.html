<ng-template #minimap>
  <canvas
    minimapCanvas
    aria-hidden="true"
    [themeRevision]="themeRevision()"
    [maskColor]="maskColor()"
    [strokeColor]="strokeColor()"
    [pannable]="pannable()"
    [zoomable]="zoomable()"
    [zoomStep]="zoomStep()"
    [position]="position()"></canvas>
</ng-template>
