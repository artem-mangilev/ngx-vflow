@for (line of guides().lines; track $index) {
  <svg:line
    class="vflow-alignment-line"
    [attr.stroke-dasharray]="line.center ? 4 : null"
    [attr.x1]="line.from.x"
    [attr.y1]="line.from.y"
    [attr.x2]="line.to.x"
    [attr.y2]="line.to.y" />
}

@if (marks(); as marks) {
  <svg:path class="vflow-alignment-line" [attr.d]="marks" />
}
