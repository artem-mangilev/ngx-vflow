<div class="selectable" (click)="pullNode()">
  <div
    nodeHandlesController
    nodeResizeController
    class="wrapper"
    [style.width.px]="wrapperSize()?.width ?? null"
    [style.height.px]="wrapperSize()?.height ?? null">
    @if (model().rawNode.component; as component) {
      <ng-container
        [entityComponentOutlet]="component"
        [entityComponentOutletLoad]="model().shouldLoad()"
        [entityComponentOutletInjector]="injector"
        (entityComponentEvent)="pushComponentEvent($event)" />
    } @else if (nodeTemplate(); as template) {
      <ng-container
        [ngTemplateOutlet]="template"
        [ngTemplateOutletContext]="model().context"
        [ngTemplateOutletInjector]="injector" />
    }
  </div>
</div>

<!-- Resizer -->
@if (model().resizerTemplate(); as template) {
  <ng-template [ngTemplateOutlet]="template" />
}

<!-- Magnets: the snap area around each measured handle while a connection is in progress -->
@if (connectionActive()) {
  @for (handle of model().handles(); track handle) {
    @if (handle.isMeasured()) {
      <div
        class="magnet"
        aria-hidden="true"
        [style.left.px]="handle.localPoint().x"
        [style.top.px]="handle.localPoint().y"
        [style.width.px]="model().magnetRadius * 2"
        [style.height.px]="model().magnetRadius * 2"
        (pointerEnd)="endConnection(); resetValidateConnection(handle)"
        (pointerOver)="validateConnection(handle)"
        (pointerOut)="resetValidateConnection(handle)"></div>
    }
  }
}
