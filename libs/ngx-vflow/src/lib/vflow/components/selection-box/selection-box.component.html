@if (selectionBox.active()) {
  <svg:rect
    class="selection-box"
    fill="var(--vflow-selection, #bbe1fa)"
    stroke="var(--vflow-selection, #bbe1fa)"
    [attr.x]="selectionBox.x()"
    [attr.y]="selectionBox.y()"
    [attr.width]="selectionBox.width()"
    [attr.height]="selectionBox.height()" />
}
