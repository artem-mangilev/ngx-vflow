<!--
  Shapes draw in the viewBox with their tip vertex at x = -1, so that the stroke ends at x = 0, the connection point
  on the outer edge of the handle, and extend to negative x. The path ends at refX, before the tip, so its square
  end is hidden: at the base of a closed arrowhead, where the fill is widest, just short of the tip of an open one,
  and at the inset a declared shape asks for (see markerTipInset). Stroke properties inherit from the marker
  element to any shape; the stroke width is `strokeWidth` flow units at any marker size.
-->
@for (marker of markers() | keyvalue; track marker.key) {
  <svg:marker
    viewBox="-10 -10 20 20"
    refY="0"
    stroke="context-stroke"
    stroke-linecap="round"
    stroke-linejoin="round"
    markerUnits="userSpaceOnUse"
    [attr.class]="'vflow-marker vflow-marker--' + (marker.value.type ?? defaultType)"
    [attr.refX]="-tipInset(marker.value)"
    [attr.stroke-width]="strokeWidth(marker.value)"
    [attr.id]="marker.key"
    [attr.markerWidth]="size(marker.value).width"
    [attr.markerHeight]="size(marker.value).height"
    [attr.orient]="marker.value.orient ?? 'auto-start-reverse'">
    @switch (marker.value.type ?? defaultType) {
      @case ('arrow-closed') {
        <svg:polyline fill="context-stroke" points="-7,-4 -1,0 -7,4 -7,-4" />
      }
      @case ('arrow') {
        <svg:polyline fill="none" points="-6,-4 -1,0 -6,4" />
      }
      @default {
        @if (shapes().get(marker.value.type ?? defaultType); as shape) {
          <ng-container [ngTemplateOutlet]="shape.template" />
        }
      }
    }
  </svg:marker>
}
