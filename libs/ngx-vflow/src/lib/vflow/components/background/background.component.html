@if (backgroundSignal().type === 'dots') {
  <svg:pattern
    patternUnits="userSpaceOnUse"
    [attr.id]="patternId"
    [attr.x]="x()"
    [attr.y]="y()"
    [attr.width]="scaledGap()"
    [attr.height]="scaledGap()">
    <svg:circle
      class="vflow-background-dot"
      fill="var(--vflow-muted, #b1b1b7)"
      [attr.cx]="patternSize()"
      [attr.cy]="patternSize()"
      [attr.r]="patternSize()" />
  </svg:pattern>

  <svg:rect x="0" y="0" width="100%" height="100%" [attr.fill]="patternUrl" />
}

@if (backgroundSignal().type === 'image') {
  @if (repeated()) {
    <svg:pattern
      patternUnits="userSpaceOnUse"
      [attr.id]="patternId"
      [attr.x]="imageX()"
      [attr.y]="imageY()"
      [attr.width]="scaledImageWidth()"
      [attr.height]="scaledImageHeight()">
      <svg:image [attr.href]="bgImageSrc()" [attr.width]="scaledImageWidth()" [attr.height]="scaledImageHeight()" />
    </svg:pattern>

    <svg:rect x="0" y="0" width="100%" height="100%" [attr.fill]="patternUrl" />
  }

  @if (!repeated()) {
    <svg:image
      [attr.x]="imageX()"
      [attr.y]="imageY()"
      [attr.width]="scaledImageWidth()"
      [attr.height]="scaledImageHeight()"
      [attr.href]="bgImageSrc()" />
  }
}

@if (backgroundSignal().type === 'grid') {
  <svg:pattern
    patternUnits="userSpaceOnUse"
    [attr.id]="patternId"
    [attr.x]="x()"
    [attr.y]="y()"
    [attr.width]="patternSize()"
    [attr.height]="patternSize()">
    <svg:path
      fill="none"
      class="vflow-background-grid"
      stroke="var(--vflow-muted, #b1b1b7)"
      stroke-width="1"
      [attr.d]="'M ' + patternSize() + ' 0 L 0 0 0 ' + patternSize()" />
  </svg:pattern>

  <svg:rect x="0" y="0" width="100%" height="100%" [attr.fill]="patternUrl" />
}
