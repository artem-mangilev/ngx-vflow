<vflow view="auto" [nodes]="nodes" [edges]="edges">
  <ng-template let-ctx nodeHtml><docs-node [ctx]="ctx" /></ng-template>
  <ng-template let-ctx groupNode><docs-group [ctx]="ctx" /></ng-template>
  <ng-template let-ctx edge><svg:g docsEdge [ctx]="ctx" /></ng-template>
  <ng-template let-ctx edgeLabelHtml><docs-edge-label [ctx]="ctx" /></ng-template>

  <ng-template let-ctx nodeHtml>
    <div class="custom-node" [class.custom-node_selected]="ctx.selected()">
      <button class="custom-node__button" dragHandle selectable>Drag here</button>

      <handle type="source" position="right" />
      <handle type="target" position="left" />
    </div>
  </ng-template> </vflow
>`
