<vflow view="auto" [nodes]="nodes">
  <svg:g *vEdge="let ctx" docsEdge [ctx]="ctx" />

  <ng-template let-ctx vNode>
    <div class="custom-node"></div>
    <v-node-toolbar position="top">
      <button (click)="deleteNode(ctx.node)">Delete</button>
    </v-node-toolbar>
    <v-node-toolbar position="right">
      <button>Action</button>
    </v-node-toolbar>
  </ng-template>
</vflow>
