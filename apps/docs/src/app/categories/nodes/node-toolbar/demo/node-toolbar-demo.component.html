<vflow view="auto" data-vui-theme="light" [nodes]="nodes" [edges]="edges">
  <ng-template let-ctx nodeHtml>
    @if (ctx.data().type === 'output') {
      <div class="custom-node">
        <div class="data-block">
          Output 1
          <handle position="right" type="source" [id]="ctx.data().output1" />
        </div>
        <div class="data-block">
          Output 2
          <handle position="right" type="source" [id]="ctx.data().output2" />
        </div>
      </div>
      <node-toolbar position="left">
        <button (click)="deleteNode(ctx.node)">Delete</button>
      </node-toolbar>
    }

    @if (ctx.data().type === 'input') {
      <div class="custom-node">
        <div class="data-block">
          Input 1
          <handle position="left" type="target" [id]="ctx.data().input1" />
        </div>
        <div class="data-block">
          Input 2
          <handle position="left" type="target" [id]="ctx.data().input2" />
        </div>
      </div>
      <node-toolbar position="right">
        <button (click)="deleteNode(ctx.node)">Delete</button>
      </node-toolbar>
    }
  </ng-template>
  <ng-template let-ctx edge
    ><svg:g customTemplateEdge selectable>
      <svg:path
        class="vui-edge"
        [attr.d]="ctx.path()"
        [attr.marker-start]="ctx.markerStart()"
        [attr.marker-end]="ctx.markerEnd()"
        [attr.data-vui-selected]="ctx.selected() || ctx.preselected()" /></svg:g></ng-template
  ><ng-template let-ctx edgeLabelHtml
    ><span class="vui-edge-label">{{ ctx.label.data }}</span></ng-template
  ></vflow
>
