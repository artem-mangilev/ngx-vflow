<div class="sidebar">
  <div dndDraggable class="custom-node custom-node_draggable">
    <button class="custom-node__button">Drag here</button>
  </div>
</div>

<vflow
  view="auto"
  dndDropzone
  data-vui-theme="light"
  [nodes]="nodes"
  [edges]="edges"
  (dndDrop)="createNode($event)"
  (connect)="connect($event)"
  (nodesChanges.position)="onPositionChange()">
  <ng-template let-ctx nodeHtml>
    <div class="custom-node" [class.custom-node_selected]="ctx.selected()">
      <button class="custom-node__button" selectable>Select here</button>

      <handle type="source" position="right" />
      <handle type="target" position="left" />
    </div>

    <node-toolbar>
      @if (ctx.data().canDetach) {
        <button (click)="detachNode(ctx.node.id)">Detach</button>
      }

      @if (ctx.data().canAttach) {
        <button (click)="attachNode(ctx.node.id)">Attach</button>
      }
    </node-toolbar>
  </ng-template>

  <ng-template let-ctx edge>
    <svg:path
      selectable
      fill="none"
      stroke-width="2"
      [attr.d]="ctx.path()"
      [attr.stroke]="ctx.selected() ? '#0f4c75' : '#bbe1fa'" />
  </ng-template>
  <ng-template let-ctx edgeLabelHtml
    ><span class="vui-edge-label">{{ ctx.label.data }}</span></ng-template
  ><ng-template let-ctx groupNode>
    <div
      class="vui-group"
      selectable
      [attr.data-vui-selected]="ctx.selected() || ctx.preselected()"
      [resizable]="ctx.data()?.resizable ?? false"
      [style.width.px]="ctx.width()"
      [style.height.px]="ctx.height()">
      {{ ctx.data()?.text }}
    </div>
  </ng-template></vflow
>
