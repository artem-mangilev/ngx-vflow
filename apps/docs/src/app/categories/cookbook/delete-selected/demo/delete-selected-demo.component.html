<vflow view="auto" [nodes]="nodes" [edges]="edges" (deleteRequest)="onDeleteRequest($event)">
  <div *vNode="let ctx" class="custom-node" [class.custom-node_selected]="ctx.selected()">
    <span>Node</span>

    <span vuiPort handleType="source" position="right"></span>
    <span vuiPort handleType="target" position="left"></span>
  </div>

  <svg:g *vEdge="let ctx" vEdgeInteraction class="custom-edge">
    <svg:path
      fill="none"
      stroke-width="2"
      [attr.d]="ctx.path()"
      [attr.stroke]="ctx.selected() ? '#0f4c75' : '#bbe1fa'" />
  </svg:g>
</vflow>
