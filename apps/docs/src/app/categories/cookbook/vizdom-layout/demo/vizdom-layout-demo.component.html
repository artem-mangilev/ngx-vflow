<vflow view="auto" [minZoom]="0.1" [nodes]="nodes()" [edges]="edges()" (nodesChanges.add)="fitView()">
  <ng-template let-ctx vEdge><svg:g docsEdge [ctx]="ctx" /></ng-template>

  <div *vNode="let ctx" class="custom-node" [style.background-color]="ctx.data().color" (click)="onNodeClick(ctx.node)">
    {{ ctx.data().color }}

    <span vuiPort handleType="source" position="bottom"></span>
    <span vuiPort handleType="target" position="top"></span>
  </div>
</vflow>
