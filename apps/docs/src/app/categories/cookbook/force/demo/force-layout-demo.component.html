<label class="slider">
  <span>Distance</span>
  <input type="range" min="0" step="1" max="200" value="50" (input)="onDistanceChange($event)" />
</label>

<vflow view="auto" [nodes]="nodes" [edges]="edges">
  <ng-template let-ctx vEdge><svg:g docsEdge [ctx]="ctx" /></ng-template>

  <ng-template let-ctx vNode>
    <div class="custom-node" [style.background-color]="ctx.data()">
      {{ ctx.data() }}

      <span vuiPort handleType="source" position="bottom"></span>
      <span vuiPort handleType="target" position="top"></span>
    </div>
  </ng-template>
</vflow>
