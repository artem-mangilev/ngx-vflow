<label class="slider">
  <span>Distance</span>
  <input type="range" min="0" step="1" max="200" [value]="distance()" (input)="onDistanceChange($event)" />
</label>

<vflow [vxLayout]="layout()" [nodes]="nodes" [edges]="edges">
  <svg:g *vEdge="let ctx" docsEdge [ctx]="ctx" />

  <div *vNode="let ctx" class="custom-node" [style.background-color]="ctx.data()">
    {{ ctx.data() }}

    <span vuiPort handleType="source" position="bottom" [canStart]="false" [canAccept]="false"></span>
    <span vuiPort handleType="target" position="top" [canStart]="false" [canAccept]="false"></span>
  </div>
</vflow>
