<label class="slider">
  <span>Distance</span>
  <input type="range" min="0" step="1" max="200" value="50" (input)="onDistanceChange($event)" />
</label>

<vflow view="auto" [nodes]="nodes" [edges]="edges">
  <ng-template let-ctx groupNode><docs-group [ctx]="ctx" /></ng-template>
  <ng-template let-ctx edge><svg:g docsEdge [ctx]="ctx" /></ng-template>
  <ng-template let-ctx edgeLabelHtml><docs-edge-label [ctx]="ctx" /></ng-template>

  <ng-template let-ctx nodeHtml>
    <div class="custom-node" [style.background-color]="ctx.data()">
      {{ ctx.data() }}

      <handle type="source" position="bottom" />
      <handle type="target" position="top" />
    </div>
  </ng-template>
</vflow>
