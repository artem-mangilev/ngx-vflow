<div class="demo">
  <div class="controls">
    <label>
      <input
        type="checkbox"
        [checked]="outputOneCanStart()"
        (change)="setOutputOneCanStart($any($event.target).checked)" />
      Output 1 can start connections
    </label>

    <label>
      <input
        type="checkbox"
        [checked]="inputOneCanAccept()"
        (change)="setInputOneCanAccept($any($event.target).checked)" />
      Input 1 can accept connections
    </label>
  </div>

  <vflow view="auto" [nodes]="nodes" [edges]="edges" (connect)="createEdge($event)">
    <ng-template let-ctx edge><svg:g docsEdge [ctx]="ctx" /></ng-template>

    <ng-template let-ctx node>
      @if (ctx.data().type === 'output') {
        <!-- Plain elements: the application styles them through data-vflow-handle attributes. -->
        <div class="custom-node">
          <div class="data-block">
            Output 1
            <span
              vflowHandle
              handleType="source"
              position="right"
              class="dot-handle"
              [id]="ctx.data().output1"
              [canStart]="outputOneCanStart()"></span>
          </div>
          <div class="data-block">
            Output 2
            <span vflowHandle handleType="source" position="right" class="dot-handle" [id]="ctx.data().output2"></span>
          </div>
        </div>
      }

      @if (ctx.data().type === 'input') {
        <!-- A component that is a handle: see square-handle.component.ts. -->
        <div class="custom-node">
          <div class="data-block">
            Input 1
            <square-handle
              handleType="target"
              position="left"
              [id]="ctx.data().input1"
              [canAccept]="inputOneCanAccept()" />
          </div>
          <div class="data-block">
            Input 2
            <square-handle handleType="target" position="left" [id]="ctx.data().input2" />
          </div>
        </div>
      }
    </ng-template>
  </vflow>
</div>
