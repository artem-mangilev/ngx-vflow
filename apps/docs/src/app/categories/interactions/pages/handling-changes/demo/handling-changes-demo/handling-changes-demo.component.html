<vflow
  view="auto"
  [nodes]="nodes"
  [edges]="edges"
  (connect)="createEdge($event)"
  (nodesChanges)="handleNodeChanges($event)"
  (edgesChanges)="handleEdgeChanges($event)">
  <docs-node *vNode="let ctx" [ctx]="ctx" />
  <ng-template let-ctx vEdge><svg:g docsEdge [ctx]="ctx" /></ng-template>
</vflow>

<ng-template #toast>
  <h3>{{ toastData?.title }}</h3>

  <pre>{{ toastData?.json }}</pre>
</ng-template>
