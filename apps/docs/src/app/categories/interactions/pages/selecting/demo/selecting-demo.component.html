<vflow view="auto" [nodes]="nodes" [edges]="edges">
  <ng-template let-ctx vNode>
    @if (ctx.data()?.text) {
      <docs-node [ctx]="ctx" />
    } @else {
      <div class="custom-node" [class.custom-node_selected]="ctx.selected()">
        <button class="custom-node__button" vSelectable>Select here</button>

        <span vuiPort handleType="source" position="right"></span>
      </div>
    }
  </ng-template>

  <ng-template let-ctx vEdge>
    <svg:g vEdgeInteraction>
      <svg:path
        fill="none"
        stroke-width="2"
        [attr.d]="ctx.path()"
        [attr.stroke]="ctx.selected() ? '#0f4c75' : '#bbe1fa'" />
    </svg:g>
  </ng-template>
</vflow>
