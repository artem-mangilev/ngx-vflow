<vflow view="auto" [nodes]="nodes" [edges]="edges">
  <ng-template let-ctx node>
    @if (ctx.data()?.text) {
      <docs-node [ctx]="ctx" />
    } @else {
      <div class="custom-node" [class.custom-node_selected]="ctx.selected()">
        <button class="custom-node__button" selectable>Select here</button>

        <span vflowPort type="source" position="right"></span>
      </div>
    }
  </ng-template>

  <ng-template let-ctx edge>
    <svg:g edgeInteraction>
      <svg:path
        fill="none"
        stroke-width="2"
        [attr.d]="ctx.path()"
        [attr.stroke]="ctx.selected() ? '#0f4c75' : '#bbe1fa'" />
    </svg:g>
  </ng-template>
</vflow>
