<ng-doc-root [sidebar]="!!section()" [noWidthLimit]="!section()">
  <ng-doc-navbar [hamburger]="!!section()">
    <a ngDocNavbarLeft class="logo" routerLink="/" aria-label="ngx-vflow, home">
      <img class="logo__icon" src="assets/logo.svg" alt="" />
      <span data-testid="logo-text" class="logo__text">ngx-vflow</span>
    </a>

    <nav ngDocNavbarCenter class="tabs" aria-label="Sections">
      @for (tab of tabs; track tab.id) {
        <a class="tabs__tab" [routerLink]="tab.link" [attr.aria-current]="activeTab() === tab.id ? 'page' : null">
          {{ tab.title }}
        </a>
      }
    </nav>

    <div ngDocNavbarRight class="header-controls">
      <ng-doc-theme-toggle />

      <a
        href="https://github.com/artem-mangilev/ngx-vflow"
        ng-doc-button-icon
        ngDocTooltip="Repository on GitHub"
        aria-label="Repository on GitHub"
        size="large"
        target="_blank"
        rel="noreferrer">
        <ng-doc-icon customIcon="github" [size]="24" />
      </a>
    </div>
  </ng-doc-navbar>

  @if (section(); as current) {
    <app-section-sidebar ngDocCustomSidebar [section]="current" />
  }

  <!-- The navbar hides its center slot on narrow screens; the same tabs then sit above the page. -->
  <nav class="tabs tabs--narrow" aria-label="Sections">
    @for (tab of tabs; track tab.id) {
      <a class="tabs__tab" [routerLink]="tab.link" [attr.aria-current]="activeTab() === tab.id ? 'page' : null">
        {{ tab.title }}
      </a>
    }
  </nav>

  <router-outlet />
</ng-doc-root>
